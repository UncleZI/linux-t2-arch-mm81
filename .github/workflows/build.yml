name: Build & Auto-Update Kernel

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [ main ]
    paths:
      - 'PKGBUILD'
      - 'config.x86_64'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.sync.outputs.updated }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Run update.sh inside Arch container
        id: sync
        run: |
          docker run --rm -v "$PWD:/build" -w /build archlinux:base-devel /bin/bash -c '
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm --needed sudo pacman-contrib git curl
            HOST_UID=$(stat -c "%u" /build)
            useradd -u "$HOST_UID" -m builduser || useradd -m builduser
            chown -R "$HOST_UID" /build
            chmod +x update.sh
            su - builduser -c "cd /build && ./update.sh"
          '
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet PKGBUILD; then
            source ./PKGBUILD
            git add PKGBUILD
            git commit -m "chore: update to ${pkgver}-${pkgrel}"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "No updates found."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-update
    if: |
      always() && (
        github.event_name == 'push' ||
        needs.check-update.outputs.updated == 'true'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Build kernel inside Arch container
        run: |
          docker run --rm -v "$PWD:/build" -w /build archlinux:base-devel /bin/bash -c '
            pacman-key --init
            pacman-key --populate archlinux
            pacman -Syu --noconfirm --needed sudo git
            useradd -m builduser
            echo "builduser ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
            chown -R builduser:builduser /build
            su builduser -c "
              export MAKEFLAGS=\"-j\$(nproc)\"
              export PKGEXT=\".pkg.tar.zst\"
              makepkg -s --noconfirm --skippgpcheck
            "
          '

      - name: Read version from PKGBUILD
        id: meta
        run: |
          source ./PKGBUILD
          echo "fullver=${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.fullver }}
          name: linux-t2-mm81 ${{ steps.meta.outputs.fullver }}
          body: |
            Arch Linux kernel and headers tailored for **Mac mini 2018 (`macmini8,1`)**.

            ### Installation
            ```sh
            sudo pacman -U linux-t2-mm81-*.pkg.tar.zst linux-t2-mm81-headers-*.pkg.tar.zst
            ```
          files: |
            *.pkg.tar.zst

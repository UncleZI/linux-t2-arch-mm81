name: Build & Auto-Update Kernel

on:
  schedule:
    - cron: '0 6 * * *'
  push:
    branches: [ main ]
    paths:
      - 'PKGBUILD'
      - 'config.x86_64'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-update:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    outputs:
      updated: ${{ steps.sync.outputs.updated }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install update tools
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm git pacman-contrib curl

      - name: Run update.sh and push if changed
        id: sync
        run: |
          useradd -m builder
          mkdir -p /tmp/srcdest
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/srcdest
          chmod +x update.sh
          git config --system --add safe.directory '*'
          su builder -c 'cd "$GITHUB_WORKSPACE" && SRCDEST=/tmp/srcdest ./update.sh'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet PKGBUILD; then
            source ./PKGBUILD
            git add PKGBUILD
            git commit -m "chore: update to ${pkgver}-${pkgrel}"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          else
            echo "No updates found."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check-update
    if: |
      always() && (
        github.event_name == 'push' ||
        needs.check-update.outputs.updated == 'true'
      )
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Initialize pacman and install dependencies
        run: |
          pacman-key --init
          pacman-key --populate archlinux
          pacman -Syu --noconfirm git sudo

      - name: Setup builder user and build kernel
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /tmp/srcdest
          chown -R builder:builder "$GITHUB_WORKSPACE" /tmp/srcdest
          git config --system --add safe.directory '*'
          su builder -c '
            cd "$GITHUB_WORKSPACE"
            export SRCDEST=/tmp/srcdest
            export MAKEFLAGS="-j$(nproc)"
            export PKGEXT=".pkg.tar.zst"
            makepkg -s --noconfirm --skippgpcheck
          '

      - name: Read version from PKGBUILD
        id: meta
        run: |
          source ./PKGBUILD
          echo "fullver=${pkgver}-${pkgrel}" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.fullver }}
          name: linux-t2-mm81 ${{ steps.meta.outputs.fullver }}
          body: |
            Arch Linux kernel and headers tailored for **Mac mini 2018 (`macmini8,1`)**.

            ### Installation
            ```sh
            sudo pacman -U linux-t2-mm81-*.pkg.tar.zst linux-t2-mm81-headers-*.pkg.tar.zst
            ```
          files: |
            *.pkg.tar.zst
